<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RideLink location sharing</title><style>body{font:16px system-ui;background:#f8f6fd;color:#30254b;padding:24px;max-width:520px;margin:auto}main{background:white;padding:24px;border-radius:18px}a{color:#7050b4}small{color:#756c86;line-height:1.5}</style></head><body><main><h1>RideLink live location</h1><p id="status">Connecting…</p><p id="coords"></p><p id="time"></p><a id="map" target="_blank" rel="noopener noreferrer"></a><p><small>Updates depend on the sender keeping RideLink open with location permission. A stale location does not mean the person is safe. Opening a map sends coordinates to that map service.</small></p></main><script>const t=new URLSearchParams(location.hash.slice(1)).get('token');async function poll(){if(!t){document.getElementById('status').textContent='This link is missing its sharing token.';return}try{const r=await fetch('/api/location/view',{headers:{Authorization:'Bearer '+t},cache:'no-store'}),v=await r.json();if(!r.ok){document.getElementById('status').textContent=v.error;return}document.getElementById('status').textContent=v.updated_at?'Location shared':'Waiting for the sender’s location…';if(v.updated_at){document.getElementById('coords').textContent=`${v.lat.toFixed(5)}, ${v.lng.toFixed(5)} · accuracy approximately ${Math.round(v.accuracy)} m`;document.getElementById('time').textContent='Last updated '+new Date(v.updated_at).toLocaleString();let a=document.getElementById('map');a.href='https://www.openstreetmap.org/?mlat='+encodeURIComponent(v.lat)+'&mlon='+encodeURIComponent(v.lng)+'#map=16/'+encodeURIComponent(v.lat)+'/'+encodeURIComponent(v.lng);a.textContent='Open this location on a map ↗'}}catch(e){document.getElementById('status').textContent='Unable to retrieve location. Retrying…'}}poll();setInterval(poll,10000);</script></body></html>
